[package]
name = "prebase-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PreBase analysis engine — canonical graph owner and stdio IPC server"

[[bin]]
name = "prebase-engine"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
streaming-iterator = "0.1"
gix = { version = "0.70", default-features = true, features = ["revision", "max-performance-safe"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3.14"
